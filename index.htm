<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔓 Bất ngờ cho em Huy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1b2a4a, #0a0f1f);
            overflow: hidden;
            position: relative;
        }

        /* Nền sao */
        .stars {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle linear infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.15; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        .container {
            text-align: center;
            z-index: 2;
            padding: 20px;
            position: relative;
        }

        /* Màn giới thiệu */
        .intro {
            color: #dfe6f5;
            font-size: 1.3rem;
            line-height: 1.9;
            letter-spacing: 1px;
            animation: fadeIn 1.5s ease;
        }
        .intro b {
            color: #ffd34d;
            font-size: 1.5rem;
        }

        /* Rương bí ẩn */
        .chest {
            font-size: 130px;
            cursor: pointer;
            display: inline-block;
            margin: 30px 0;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 25px rgba(255, 211, 77, 0.5));
            transition: transform 0.2s;
        }
        .chest:hover { transform: scale(1.12) rotate(-6deg); }
        .chest:active { transform: scale(0.88); }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-22px); }
        }

        .hint {
            color: #8899bb;
            font-size: 1rem;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Phần quà */
        .surprise { display: none; }

            background: linear-gradient(145deg, #22345f, #141b33);
            border: 2px solid #ffd34d;
            border-radius: 28px;
            padding: 40px 30px;
            max-width: 640px;
            margin: 0 auto;
            box-shadow: 0 0 60px rgba(255, 211, 77, 0.35);
            animation: zoomIn 1s ease;
            position: relative;
        }

            color: #ffd34d;
            font-size: 2.4rem;
            text-shadow: 0 0 25px rgba(255,211,77,0.7);
            animation: glow 2s ease-in-out infinite;
        }
